# =============================================================================
# mc.conf — ÚNICA fuente de configuración (D-20)
# Cambiar de proveedor VPS = editar ESTE archivo y volver a desplegar.
# Los módulos lo leen; ninguno guarda rutas propias.
# Formato: bash shell (se hace `source` desde cada módulo).
# =============================================================================

# --- Ubicaciones -------------------------------------------------------------
# Layout PLANO (el de Mojang): bedrock_server, server.properties, worlds/,
# behavior_packs/ y resource_packs/ viven todos en $MC_HOME.
export MC_HOME="${MC_HOME:-/opt/mcserver}"
export MC_CONF="${MC_CONF:-$MC_HOME/config/mc.conf}"
export MC_BDS_ROOT="$MC_HOME"               # working dir del binario BDS
export MC_SERVER_PROPS="$MC_HOME/server.properties"
export MC_ALLOWLIST="$MC_HOME/allowlist.json"
export MC_WORLD_DIR="$MC_HOME/worlds"       # level-name dentro de aquí
export MC_LEVEL_NAME="${MC_LEVEL_NAME:-world}"  # debe coincidir con level-name=
export MC_WORLD="$MC_WORLD_DIR/$MC_LEVEL_NAME"  # carpeta ACTIVA del mundo (aquí van world_*_packs.json)
export MC_PACKS_BP="$MC_HOME/behavior_packs"
export MC_PACKS_RP="$MC_HOME/resource_packs"
export MC_CONFIG_DIR="$MC_HOME/config"      # NUESTRO config (mc.conf) — no el de BDS
export MC_LOG_DIR="$MC_HOME/logs"
export MC_BACKUP_DIR="${MC_BACKUP_DIR:-/var/backups/mcserver}"
export MC_STAGING_DIR="$MC_HOME/staging"
export MC_BLOCKS_DIR="$MC_HOME/blocks.d"    # bloques descargados (fuente)

# --- Servicios systemd -------------------------------------------------------
export MC_SERVICE="mc"                      # servidor BDS
export MC_PANEL_SERVICE="mc-panel"          # panel web (fase 2)
export MC_USER="${MC_USER:-mcserver}"       # usuario sin privilegios que corre el BDS

# --- Red ---------------------------------------------------------------------
export MC_PORT="${MC_PORT:-19132}"          # TCP/UDP jugadores (NetherNet)
export MC_PORT_V6="${MC_PORT_V6:-19133}"    # reservado (v6, legacy)
export MC_UDP_RANGE="${MC_UDP_RANGE:-19132-19232}"  # rango UDP de juego (server-udp-ports)
export MC_STAGING_PORT="${MC_STAGING_PORT:-19134}"  # UDP solo para smoke test
export MC_PANEL_PORT="${MC_PANEL_PORT:-8443}"
export MC_PANEL_BIND="${MC_PANEL_BIND:-127.0.0.1}"  # nunca 0.0.0.0 (ir tras proxy)

# --- Versión -----------------------------------------------------------------
export MC_VERSION_FILE="$MC_HOME/version.txt"
export MC_BDS_URL_BASE="https://www.minecraft.net/bedrockdedicatedserver/bin-linux"
# Página de descarga oficial (para descubrir la última versión):
export MC_BDS_PAGE="https://www.minecraft.net/en-us/download/server/bedrock"

# --- Ajustes del juego (D-09, D-19) ------------------------------------------
export MC_VIEW_DISTANCE="${MC_VIEW_DISTANCE:-12}"
export MC_TICK_DISTANCE="${MC_TICK_DISTANCE:-4}"
export MC_MAX_THREADS="${MC_MAX_THREADS:-2}"
export MC_MAX_PLAYERS="${MC_MAX_PLAYERS:-15}"
export MC_DIFFICULTY="${MC_DIFFICULTY:-hard}"
export MC_SERVER_NAME="${MC_SERVER_NAME:-Servidor Peru}"   # P-04 pendiente

# --- Backups (D-07) ----------------------------------------------------------
export MC_BACKUP_KEEP="${MC_BACKUP_KEEP:-14}"          # copias a conservar
export MC_BACKUP_HOUR="${MC_BACKUP_HOUR:-04:00}"
# Comando opcional de copia fuera del VPS (ej: rclone copy ...). Vacío = desactivado.
# D-44: cada backup se copia a Google Drive (remote rclone "gdrive", carpeta mcserver-backups).
export MC_OFFSITE_CMD="${MC_OFFSITE_CMD:-rclone copy \$MC_BACKUP_FILE gdrive:mcserver-backups/ --config /root/.config/rclone/rclone.conf}"

# --- Actualizaciones (D-11) --------------------------------------------------
export MC_CHECK_INTERVAL_HOURS="${MC_CHECK_INTERVAL_HOURS:-6}"
export MC_UPDATE_WEBHOOK="${MC_UPDATE_WEBHOOK:-}"      # Discord: avisos de versión

# --- Estado / cola Q1 (D-16) -------------------------------------------------
export MC_STATUS_WEBHOOK="${MC_STATUS_WEBHOOK:-}"      # Discord: contador de jugadores
export MC_STATUS_INTERVAL_S="${MC_STATUS_INTERVAL_S:-300}"

# --- Consola in-game (reemplazo del RCON, D-17) ------------------------------
export MC_FIFO="${MC_FIFO:-/run/mc-console.sock}"      # FIFO que alimenta el stdin del BDS

# --- Admins de juego (D-34) --------------------------------------------------
export MC_FOUNDER="${MC_FOUNDER:-founder}"            # gamertag del fundador (root): nunca se le quita el OP
export MC_OP_LEVEL="${MC_OP_LEVEL:-4}"                 # nivel de OP que concede game_admin.sh
export MC_OPS_FILE="${MC_OPS_FILE:-$MC_HOME/ops.json}" # archivo de operadores de BDS

# --- Panel (D-17) ------------------------------------------------------------
export MC_PANEL_SECRET="${MC_PANEL_SECRET:-}"          # obligatorio: sesión
export MC_PANEL_ADMIN_PASS="${MC_PANEL_ADMIN_PASS:-}"  # pass inicial del admin (cambiar tras 1er login)

# --- Bot Telegram de gestión (D-28) ------------------------------------------
export MC_BOT_ENABLED="${MC_BOT_ENABLED:-false}"       # solo true con token y admins puestos
export MC_BOT_TOKEN="${MC_BOT_TOKEN:-}"                # token de @BotFather (solo en el server)
export MC_BOT_ADMINS="${MC_BOT_ADMINS:-}"              # ids de Telegram autorizados, separados por coma
export MC_BOT_FIFO_CMD="${MC_BOT_FIFO_CMD:-$MC_HOME/modules/consola.sh}"  # consola (lista blanca)

# --- Entorno -----------------------------------------------------------------
export TZ="${TZ:-America/Lima}"
