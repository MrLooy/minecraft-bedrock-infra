# server.properties — plantilla de despliegue (D-09, D-19, P-02)
# Copiar a /opt/mcserver/server.properties y rellenar server-name (P-04).
motd=Gansitos MC
server-name=Gansitos MC
gamemode=survival
force-gamemode=false
difficulty=hard
allow-cheats=true
max-players=15
online-mode=false
# D-29 (2026-10-10): allow-list off temporal para gestión. Volver a true al abrir.
allow-list=false
server-port=19132
server-portv6=19133
# BDS 1.26+: transporte NetherNet (WebRTC). El handshake es HTTP/TCP en
# server-port; el tráfico de juego va por UDP dentro de server-udp-ports.
transport=nethernet
server-udp-ports=19132-19232
enable-lan-visibility=false
view-distance=8
tick-distance=4
player-idle-timeout=30
max-threads=2
level-name=world
level-seed=
# D-19: semilla aleatoria. Si D-04 usa mundo convertido (Chunker), sustituir
# worlds/world y esta línea deja de importar.
level-type=default
default-player-permission-level=member
texturepack-required=false
content-log-file-enabled=true
compression-threshold=256
compression-algorithm=zlib
server-authoritative-movement=server
player-authoritative-movement=client
# script-watchdog-memory-limit=250
